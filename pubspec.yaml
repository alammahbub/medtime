name: medtime
description: "MedTime - Your Health, On Time. Medication reminder app for elderly users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  provider: ^6.1.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  animate_do: ^3.3.4
  flutter_slidable: ^3.1.1
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
